<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Dark High Contrast complete color palette</title>
  <desc id="description">Swatches for all 50 opaque colors, 26 alpha overlays, and 9 HSL component colors used by the Logseq theme.</desc>
  <defs>
    <pattern id="checker" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#000000"/>
      <path d="M0 0h6v6H0zM6 6h6v6H6z" fill="#282828"/>
    </pattern>
    <style>
      .heading { fill: #ffffff; font: 700 22px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .subheading { fill: #d7d7d7; font: 15px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .label { fill: #ffffff; font: 11px ui-monospace, SFMono-Regular, Consolas, monospace; text-anchor: middle; }
      .alpha-label { fill: #ffffff; font: 9px ui-monospace, SFMono-Regular, Consolas, monospace; text-anchor: middle; }
      .swatch { stroke: #5b7e96; stroke-width: 1; }
    </style>
  </defs>

