name: Release

on:
  push:
    tags:
      - "theme-v*"
      - "passage-v*"
      - "anno-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select and validate package
        id: package
        run: node scripts/select-release.mjs "$GITHUB_REF_NAME"

      - name: Validate repository
        run: |
          npm run check
          git diff --check

      - name: Rebuild and verify selected package
        run: npm run check --workspace "${{ steps.package.outputs.workspace }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "${{ steps.package.outputs.release_name }}"
          files: ${{ steps.package.outputs.archive }}
